<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drøm App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
  </head>
  <body class="bg-gradient-to-b from-white via-yellow-50 to-white text-black flex flex-col min-h-screen">
    <div class="w-full absolute top-0 left-0 z-10 px-6 py-4">
      <div class="max-w-5xl mx-auto flex justify-between items-center">
        <a href="/index.html">
          <div class="flex items-center space-x-3">
              <img src="vs-logo.png" alt="Drøm Logo" class="h-10 w-10" />
              <span class="font-semibold text-2xl">Drøm</span>
          </div>
        </a>
        <a href="https://apps.apple.com/your-app-link" class="bg-black text-white text-sm font-medium px-4 py-3 rounded-lg flex items-center space-x-2 hover:bg-gray-800 transition">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4">
            <path fill="currentColor" d="M17.05 20.28c-.98.95-2.05.8-3.08.35c-1.09-.46-2.09-.48-3.24 0c-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8c1.18-.24 2.31-.93 3.57-.84c1.51.12 2.65.72 3.4 1.8c-3.12 1.87-2.38 5.98.48 7.13c-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25c.29 2.58-2.34 4.5-3.74 4.25"></path>
          </svg>
          <span>Download for iOS</span>
        </a>
      </div>
    </div>

    <main class="flex-grow flex flex-col items-center justify-center text-center pt-20 px-6 py-12">
      <h1 class="text-4xl md:text-6xl font-semibold mb-6">Dream. Act. Evolve.</h1>
      <p class="text-lg md:text-xl max-w-xl mb-10">
        Unlock the power of your dreams. Explore your subconscious and grow through dream interpretation with Drøm.
      </p>

      <div class="flex flex-wrap justify-center gap-6 max-w-5xl">
        <img src="app1.png" alt="Drøm App Screenshot 1" class="w-64 md:w-80" />
        <img src="app2.png" alt="Drøm App Screenshot 2" class="w-64 md:w-80" />
        <img src="app3.png" alt="Drøm App Screenshot 3" class="w-64 md:w-80" />
      </div>
    </main>

    <footer class="text-sm text-gray-600 text-center py-6 border-t border-gray-300">
      <div class="flex flex-col sm:flex-row justify-center gap-4">
        <a href="https://apps.apple.com/your-app-link" class="hover:text-black transition">App Store</a>
        <a href="/privacy-policy.html" class="hover:text-black transition">Privacy Policy</a>
        <a href="/terms-of-use.html" class="hover:text-black transition">Terms of Use</a>
        <a href="https://www.viasomnii.net" class="hover:text-black transition">Via Somnii</a>
      </div>
      <p class="mt-4">&copy; 2025 Via Somnii</p>
    </footer>
  </body>
</html>
